name: Build Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Accept Android licenses and install NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/cmdline-tools" || true
          yes | sdkmanager --licenses > /dev/null || true
          for i in 1 2 3; do
            sdkmanager --install "ndk;27.1.12297006" && break || {
              echo "NDK install attempt $i failed, clearing corrupted downloads and retrying..."
              rm -rf "$ANDROID_HOME/.temp" || true
              sleep 10
            }
          done
          sdkmanager --list_installed | grep -i ndk || (echo "NDK 27.1.12297006 not installed" && exit 1)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild Android (Debug variant)
        env:
          APP_VARIANT: debug
        run: bunx expo prebuild --platform android --no-install --non-interactive

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-debug-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-debug-
            ${{ runner.os }}-gradle-

      - name: Make Gradle executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Build Debug APK
        env:
          APP_VARIANT: debug
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.1.12297006
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: android

      - name: Upload Debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
